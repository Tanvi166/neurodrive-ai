services:
  - type: web
    name: neurodrive-ai-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: MODEL_PATH
        value: /app/backend/yolov8n.pt
